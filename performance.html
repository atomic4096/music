<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>演技用音源</title>

<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">

<style>

body{
  font-family:sans-serif;
  background:#000;
  margin:0;
  padding:20px;
  padding-bottom:260px;

  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:20px;
}

.back-btn{
  grid-column:span 2;

  height:120px;

  font-size:36px;
  font-weight:bold;

  background:#FFD700;
  color:#000;

  border:4px solid #E53935;
  border-radius:20px;
}

.menu-btn{
  height:180px;

  font-size:36px;
  font-weight:bold;

  border-radius:20px;

  background:#1976D2;
  color:white;

  border:4px solid #90CAF9;
}

.menu-btn:active{
  transform:scale(.95);
}

#nowPlaying{
  grid-column:span 2;

  text-align:center;

  color:#FFD700;
  font-size:42px;
  font-weight:bold;
}

.transport{
  grid-column:span 2;

  display:grid;
  grid-template-columns:1fr 1fr;
  gap:20px;
}

.control{
  height:110px;

  font-size:50px;

  border-radius:20px;

  background:#444;
  color:#FFD700;
  border:4px solid #FFD700;
}

.seek-buttons{
  grid-column:span 2;

  display:grid;
  grid-template-columns:repeat(4,1fr);

  gap:10px;
}

.seek-btn{
  height:90px;

  font-size:30px;

  border-radius:16px;

  background:#333;
  color:white;

  border:3px solid #90CAF9;
}

#seekBar{
  grid-column:span 2;

  width:100%;
  height:60px;
}

#timeDisplay{
  grid-column:span 2;

  text-align:center;

  color:white;
  font-size:34px;
  font-weight:bold;
}

</style>
</head>

<body>

<button
class="back-btn"
onclick="location.href='index.html'">
← 練習用へ戻る
</button>

<button class="menu-btn" data-sound="1">
あいみょん
</button>

<button class="menu-btn" data-sound="2">
Journey to Fantasy Springs
</button>

<button class="menu-btn" data-sound="3">
ゆうほ・りほ
Mariah Carey
</button>

<button class="menu-btn" data-sound="4">
演技曲④
</button>

<button class="menu-btn" data-sound="5">
演技曲⑤
</button>

<button class="menu-btn" data-sound="6">
演技曲⑥
</button>

<button class="menu-btn" data-sound="7">
演技曲⑦
</button>

<button class="menu-btn" data-sound="8">
演技曲⑧
</button>

<button class="menu-btn" data-sound="9">
演技曲⑨
</button>

<button class="menu-btn" data-sound="10">
演技曲⑩
</button>
<button class="menu-btn" data-sound="11">
演技曲⑪
</button>
<button class="menu-btn" data-sound="12">
演技曲⑫
</button>

<div id="nowPlaying">
再生中：なし
</div>

<div class="transport">

<button id="resumeBtn" class="control">
▶
</button>

<button id="pauseBtn" class="control">
⏸
</button>

</div>

<div class="seek-buttons">

<button id="back10" class="seek-btn">
⏪10
</button>

<button id="back1" class="seek-btn">
◀1
</button>

<button id="next1" class="seek-btn">
1▶
</button>

<button id="next10" class="seek-btn">
10⏩
</button>

</div>

<input
type="range"
id="seekBar"
min="0"
max="100"
value="0">

<div id="timeDisplay">
0:00 / 0:00
</div>

<script>

const base =
"https://raw.githubusercontent.com/atomic4096/music/main/";

const soundURLs = {

  1: base + "aimyon.mp3",
  2: base + "Journey to Fantasy Springs.m4a",
  3: base + "Mariah Carey.mp3"
  // 追加曲があればここへ

};

let currentPlaying = null;

document
.querySelectorAll(".menu-btn[data-sound]")
.forEach(btn=>{

  btn.addEventListener("click",()=>{

    const id = btn.dataset.sound;

    if(!soundURLs[id]) return;

    if(currentPlaying){
      currentPlaying.pause();
      currentPlaying.currentTime = 0;
    }

    currentPlaying =
      new Audio(soundURLs[id]);

    currentPlaying.play();

    nowPlaying.textContent =
      "再生中：" +
      btn.textContent.trim();

  });

});

resumeBtn.onclick = ()=>{

  if(currentPlaying){
    currentPlaying.play();
  }

};

pauseBtn.onclick = ()=>{

  if(currentPlaying){
    currentPlaying.pause();
  }

};

back10.onclick = ()=>{

  if(currentPlaying){

    currentPlaying.currentTime =
      Math.max(
        0,
        currentPlaying.currentTime - 10
      );

  }

};

back1.onclick = ()=>{

  if(currentPlaying){

    currentPlaying.currentTime =
      Math.max(
        0,
        currentPlaying.currentTime - 1
      );

  }

};

next1.onclick = ()=>{

  if(currentPlaying){

    currentPlaying.currentTime =
      Math.min(
        currentPlaying.duration,
        currentPlaying.currentTime + 1
      );

  }

};

next10.onclick = ()=>{

  if(currentPlaying){

    currentPlaying.currentTime =
      Math.min(
        currentPlaying.duration,
        currentPlaying.currentTime + 10
      );

  }

};

seekBar.addEventListener("input",e=>{

  if(!currentPlaying) return;

  currentPlaying.currentTime =
    currentPlaying.duration *
    e.target.value / 100;

});

setInterval(()=>{

  if(!currentPlaying) return;

  if(!currentPlaying.duration) return;

  const p =
    currentPlaying.currentTime /
    currentPlaying.duration *
    100;

  seekBar.value = p;

  const format = s => {

    const m =
      Math.floor(s/60);

    const sec =
      Math.floor(s%60);

    return (
      m + ":" +
      String(sec).padStart(2,"0")
    );
  };

  timeDisplay.textContent =
    format(currentPlaying.currentTime)
    + " / " +
    format(currentPlaying.duration);

},200);

</script>

</body>
</html>
