<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>練習メニュー音出し</title>
<style>
  body {
    font-family: sans-serif;
    background: #000;
    margin: 0;
    padding: 20px;
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 18px;
  }

  button {
    padding: 20px;
    font-size: 22px;
    width: 100%;
    height: 115px;
    border-radius: 14px;
    border: 3px solid #FFD700;
    background: #E53935;
    color: #fff;
    font-weight: bold;
    box-shadow: 0 4px 10px rgba(255, 0, 0, 0.25);
    transition: 0.1s;
  }

  button:active {
    transform: scale(0.96);
    background: #B71C1C;
  }

  /* 停止・再開ボタンは色を変える */
  .control {
    background: #444;
    border: 3px solid #FFD700;
    color: #FFD700;
  }

  .control:active {
    background: #222;
  }
</style>
</head>
<body>

<!-- 再生ボタン -->
<button data-sound="1">ストレッチ</button>
<button data-sound="2">外周</button>
<button data-sound="3">1分スピン</button>
<button data-sound="4">足出し足着きスピン</button>
<button data-sound="5">アイドリング・8の字</button>
<button data-sound="6">乗り技</button>
<button data-sound="7">振り練</button>
<button data-sound="8">30秒スピン</button>

<!-- 停止・再開ボタン -->
<button id="pauseBtn" class="control">一時停止</button>
<button id="resumeBtn" class="control">再開</button>

<script>
  const base = "https://raw.githubusercontent.com/atomic4096/music/main/";

  const soundURLs = {
    1: base + "stretch.mp3",
    2: base + "outer_loop.mp3",
    3: base + "spin_1min.mp3",
    4: base + "leg_spin.mp3",
    5: base + "idling_figure8.mp3",
    6: base + "trick_riding.mp3",
    7: base + "swing_practice.mp3",
    8: base + "spin_30sec.mp3"
  };

  const audios = {};
  let currentPlaying = null;

  for (let i = 1; i <= 8; i++) {
    audios[i] = new Audio(soundURLs[i]);
  }

  // 再生ボタン
  document.querySelectorAll("button[data-sound]").forEach(btn => {
    btn.addEventListener("click", () => {
      const id = Number(btn.dataset.sound);

      // 他の音を止める
      for (let i = 1; i <= 8; i++) {
        audios[i].pause();
        audios[i].currentTime = 0;
      }

      audios[id].play();
      currentPlaying = id;
    });
  });

  // 一時停止ボタン
  document.getElementById("pauseBtn").addEventListener("click", () => {
    if (currentPlaying !== null) {
      audios[currentPlaying].pause();
    }
  });

  // 再開ボタン
  document.getElementById("resumeBtn").addEventListener("click", () => {
    if (currentPlaying !== null) {
      audios[currentPlaying].play();
    }
  });
</script>

</body>
</html>
