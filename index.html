<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>練習メニュー音出し</title>

<!-- PWA設定 -->
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">

<style>
  body {
    font-family: sans-serif;
    background: #000;
    margin: 0;
    padding: 20px;
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 20px;
  }

  button {
    padding: 25px;
    font-size: 28px;
    width: 100%;
    height: 150px;
    border-radius: 16px;
    border: 3px solid #FFD700;
    background: #E53935;
    color: #fff;
    font-weight: bold;
    box-shadow: 0 4px 12px rgba(255, 0, 0, 0.25);
    transition: 0.1s;
  }

  button:active {
    transform: scale(0.95);
    background: #B71C1C;
  }

  /* 一時停止・再開ボタン */
  .control {
    background: #444;
    border: 3px solid #FFD700;
    color: #FFD700;
    font-size: 45px;
  }

  /* リピートボタン */
  #repeatBtn {
    background: #333;
    border: 3px solid #FFD700;
    color: #FFD700;
    font-size: 40px;
  }

  #repeatBtn.active {
    background: #FFD700;
    color: #000;
  }
</style>
</head>
<body>

<!-- 基礎練習8曲 -->
<button data-sound="1">ストレッチ</button>
<button data-sound="2">外周</button>
<button data-sound="3">1分スピン</button>
<button data-sound="4">足出し足着きスピン</button>
<button data-sound="5">アイドリング・8の字</button>
<button data-sound="6">乗り技</button>
<button data-sound="7">振り練</button>
<button data-sound="8">30秒スピン</button>

<!-- リピート・一時停止・再開 -->
<button id="repeatBtn">🔁</button>
<button id="pauseBtn" class="control">⏸</button>
<button id="resumeBtn" class="control">▶</button>

<script>
  const base = "https://raw.githubusercontent.com/atomic4096/music/main/";

  const soundURLs = {
    1: base + "stretch.mp3",
    2: base + "outer_loop.mp3",
    3: base + "spin_1min.mp3",
    4: base + "leg_spin.mp3",
    5: base + "idling_figure8.mp3",
    6: base + "trick_riding.mp3",
    7: base + "swing_practice.mp3",
    8: base + "spin_30sec.mp3"
  };

  const audios = {};
  let currentPlaying = null;
  let repeatMode = false;

  for (let i = 1; i <= 8; i++) {
    audios[i] = new Audio(soundURLs[i]);
  }

  // 再生ボタン
  document.querySelectorAll("button[data-sound]").forEach(btn => {
    btn.addEventListener("click", () => {
      const id = Number(btn.dataset.sound);

      // 他の音を止める
      for (let i = 1; i <= 8; i++) {
        audios[i].pause();
        audios[i].currentTime = 0;
      }

      currentPlaying = audios[id];
      currentPlaying.loop = repeatMode;
      currentPlaying.play();
    });
  });

  // リピート切り替え
  document.getElementById("repeatBtn").addEventListener("click", () => {
    repeatMode = !repeatMode;

    const btn = document.getElementById("repeatBtn");
    if (repeatMode) {
      btn.classList.add("active");
    } else {
      btn.classList.remove("active");
    }

    if (currentPlaying) {
      currentPlaying.loop = repeatMode;
    }
  });

  // 一時停止
  document.getElementById("pauseBtn").addEventListener("click", () => {
    if (currentPlaying) currentPlaying.pause();
  });

  // 再開
  document.getElementById("resumeBtn").addEventListener("click", () => {
    if (currentPlaying) currentPlaying.play();
  });

  // Service Worker 登録
  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("service-worker.js");
  }
</script>

</body>
</html>
