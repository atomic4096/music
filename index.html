<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>練習メニュー音出し</title>
<style>
  body {
    font-family: sans-serif;
    background: #f4f4f4; /* 明るい背景で見やすい */
    margin: 0;
    padding: 20px;
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 16px;
  }

  button {
    padding: 20px;
    font-size: 22px;
    width: 100%;
    height: 110px;
    border-radius: 14px;
    border: 3px solid #FFD700; /* 金の枠線 */
    background: #D32F2F; /* 明るめの赤 */
    color: #fff; /* 白文字で視認性UP */
    font-weight: bold;
    box-shadow: 0 3px 6px rgba(0,0,0,0.2);
    transition: 0.1s;
  }

  button:active {
    transform: scale(0.96);
    background: #8B0000; /* 暗い赤で押した感 */
  }
</style>
</head>
<body>

<button data-sound="1">ストレッチ</button>
<button data-sound="2">外周</button>
<button data-sound="3">1分スピン</button>
<button data-sound="4">足出し足着きスピン</button>
<button data-sound="5">アイドリング・8の字</button>
<button data-sound="6">乗り技</button>
<button data-sound="7">振り練</button>
<button data-sound="8">30秒スピン</button>

<script>
  const base = "https://raw.githubusercontent.com/atomic4096/music/main/";

  const soundURLs = {
    1: base + "stretch.mp3",
    2: base + "outer_loop.mp3",
    3: base + "spin_1min.mp3",
    4: base + "leg_spin.mp3",
    5: base + "idling_figure8.mp3",
    6: base + "trick_riding.mp3",
    7: base + "swing_practice.mp3",
    8: base + "spin_30sec.mp3"
  };

  const audios = {};
  for (let i = 1; i <= 8; i++) {
    audios[i] = new Audio(soundURLs[i]);
  }

  document.querySelectorAll("button").forEach(btn => {
    btn.addEventListener("click", () => {
      const id = btn.dataset.sound;

      for (let i = 1; i <= 8; i++) {
        audios[i].pause();
        audios[i].currentTime = 0;
      }

      audios[id].play();
    });
  });
</script>

</body>
</html>
